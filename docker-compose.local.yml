volumes:
  the_wall_api_local_postgres_data: {}
  the_wall_api_local_postgres_data_backups: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: the_wall_api_local_django
    container_name: the_wall_api_local_django
    depends_on:
      - postgres
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: the_wall_api_production_postgres
    container_name: the_wall_api_local_postgres
    volumes:
      - the_wall_api_local_postgres_data:/var/lib/postgresql/18/docker
      - the_wall_api_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  redis:
    image: docker.io/redis:8.4
